<!doctype html>
<html lang="en" class="dark Theme--black Theme--nav-top Theme--width-boxed">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cavanagh Unraid Themer Preview</title><link rel="stylesheet" href="cavanagh-family.css"><style>
body{margin:0;font-family:Arial,sans-serif;min-height:100vh}.preview{min-height:100vh;display:grid;grid-template-columns:minmax(260px,1fr) minmax(360px,540px);background:url("assets/background-dark.webp") left center/cover no-repeat fixed}.brand{display:grid;place-content:center;padding:4rem;background:linear-gradient(90deg,rgba(12,12,13,.08),rgba(12,12,13,.5))}.brand img{width:min(760px,92%);margin:auto}.login{padding:clamp(2rem,7vw,6rem);background:rgba(21,21,21,.96);border-left:1px solid var(--cavanagh-line);display:flex;flex-direction:column;justify-content:center}.wordmark{width:min(430px,100%);margin-bottom:1.25rem}.login h1{font:600 3rem Georgia,serif;margin:.8rem 0 .2rem}.login h2{font-size:1rem;color:var(--cavanagh-muted);margin:0 0 2rem}.login input,.login button{box-sizing:border-box;width:100%;padding:1rem;margin:.45rem 0;font-size:1rem}.login button{background:linear-gradient(135deg,#a51c21,var(--cavanagh-red));color:white;border:1px solid #bd3438}@media(max-width:760px){.preview{grid-template-columns:1fr}.brand{display:none}.login{min-height:100vh;border:0}}
</style></head><body><div class="preview"><section class="brand"></section><main class="login"><img class="wordmark" src="assets/cavanagh-logo-dark.svg" alt="Cavanagh Family Single Sign-On"><h1>Braavos</h1><h2>Media server</h2><form><input placeholder="Username"><input type="password" placeholder="Password"><button type="button">Login</button></form></main></div></body></html>
